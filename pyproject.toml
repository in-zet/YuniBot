[project]
name = "yunibot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiolimiter~=1.2",
    "aiosqlite>=0.21",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "discord-py~=2.7",
    "google-genai~=2.29.0",
    "hishel[sqlite]==0.1.3",
    "httpx~=0.28.1",
    "httpx-aiohttp==0.2.0",
    "msgspec~=0.20.0",
    "platformdirs~=4.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "selectolax==0.4.10",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
# "."은 skills/<스킬>/tests/처럼 tests/ 패키지 밖의 스킬 테스트가 core를 import할 수 있게 한다.
pythonpath = ["third_party", "."]
asyncio_mode = "auto"

[tool.ruff]
# third_party/는 가져온 코드 그대로다. 린트는 우리가 쓴 코드만 본다.
exclude = ["third_party"]

[tool.basedpyright]
exclude = ["third_party"]
extraPaths = ["third_party"]
