- canonical: "저스티스 크리티컬"
  category: judgment
  aliases: [JC, 저크]
  meaning: 가장 높은 단계의 판정. 만점(AJC)을 받으려면 모든 노트를 이 판정으로 쳐야 한다.
- canonical: "안미츠"
  category: technique
  aliases: [비비기]
